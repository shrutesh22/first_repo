apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: app-gamma
  namespace: ns-gamma
spec:
  hosts:
  - "*"
  gateways:
  - istio-system/sample-gateway
  http:
  - match:
    - uri:
        prefix: /gamma
    route:
    - destination:
        host: sample-app.ns-gamma.svc.cluster.local
        port:
          number: 80